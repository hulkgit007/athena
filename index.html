<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Git Tutorial</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f172a, #1e293b, #334155);
            color: #e2e8f0;
            font-family: 'Poppins', 'Segoe UI', sans-serif;
            text-align: center;
            padding: 24px;
        }

        p {
            margin: 12px 0;
            font-size: 1.1rem;
            line-height: 1.6;
            color: #dbeafe;
        }

        p:first-child {
            font-size: 2.2rem;
            font-weight: 700;
            color: #f8fafc;
            letter-spacing: 0.04em;
        }

        p:nth-child(2) {
            color: #93c5fd;
        }

        p:nth-child(3) {
            color: #bfdbfe;
        }
    </style>
</head>
<body>
    <p>Welcome to Git Tutorial</p>
    <p>Made second change</p>
    <p>I've made 5th Commit Properly</p>
</body>
</html>
